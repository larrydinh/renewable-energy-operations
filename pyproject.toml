[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "renewable-energy-operations"
version = "0.1.0"
description = "Import, validate, and monitor German renewable-generation data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "pandas>=2.2,<4",
    "plotly>=5.24,<7",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
    "requests>=2.32,<3",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.66,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "editables>=0.5,<1",
    "hatchling>=1.27,<2",
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
energy-ops = "energy_ops.cli:main"

[project.urls]
Repository = "https://github.com/larrydinh/renewable-energy-operations"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
markers = ["integration: requires an isolated PostgreSQL database"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
