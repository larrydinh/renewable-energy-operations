[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "renewable-energy-operations"
version = "0.1.0"
description = "Import, validate, and monitor German renewable-generation data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "editables>=0.5,<1",
    "hatchling>=1.27,<2",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
energy-ops = "energy_ops.cli:main"

[project.urls]
Repository = "https://github.com/larrydinh/renewable-energy-operations"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
