name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install pinned development tools and package
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Test installed entry points
        run: python -m pytest
      - name: Build distribution
        run: python -m build --no-isolation
      - name: Test wheel in a clean environment
        run: |
          python -m venv /tmp/energy-ops-wheel
          /tmp/energy-ops-wheel/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/energy-ops-wheel/bin/energy-ops --version
          /tmp/energy-ops-wheel/bin/python -m energy_ops --help
