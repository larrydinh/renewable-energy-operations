name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: energy_ops
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: energy_ops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U energy_ops -d energy_ops_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://energy_ops:ci_test_password@127.0.0.1:5432/energy_ops_test
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install pinned development tools and package
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Test installed entry points
        run: python -m pytest
      - name: Build distribution
        run: python -m build --no-isolation
      - name: Test wheel in a clean environment
        run: |
          python -m venv /tmp/energy-ops-wheel
          /tmp/energy-ops-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/energy-ops-wheel/bin/energy-ops --version
          /tmp/energy-ops-wheel/bin/python -m energy_ops --help
